<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hogeki Artillery</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      --player1:#00d2ff;
      --player2:#ff007f;
    }
    body{margin:0;background:#0f132b;color:#fff;overflow:hidden}
    canvas{display:block}
    .hud{position:fixed;inset:1rem;pointer-events:none}
    .card{background:rgba(255,255,255,.08);padding:1rem;border-radius:1rem;pointer-events:auto}
    .cta{padding:.6rem 1rem;border-radius:999px;border:none;font-weight:700;cursor:pointer}
  </style>
</head>

<body>
<canvas id="game"></canvas>

<div class="hud" style="bottom:1rem;top:auto">
  <div class="card">
    <div id="shareStatus">Win a round to share.</div>
    <button class="cta" id="tweetBtn" disabled>Tweet Result</button>
  </div>
</div>

<script>
/* ===============================
   ゲーム本体（元のまま）
================================ */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

const gravity = 0.25;
let shots = 0;

const players = [
  { name:"Player", x:100, y:300, color:"#00d2ff" },
  { name:"CPU", x:canvas.width-100, y:300, color:"#ff007f" }
];

const state = {
  winner:null
};

/* 仮：Spaceで勝敗決定（元ロジックがあるなら不要） */
window.addEventListener("keydown", e=>{
  if(e.key===" " && !state.winner){
    shots++;
    state.winner = Math.random()>0.5?"Player":"CPU";
    onWin();
  }
});

function draw(){
  ctx.fillStyle="#0f132b";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  players.forEach(p=>{
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,20,0,Math.PI*2);
    ctx.fill();
  });

  ctx.fillStyle="#fff";
  ctx.fillText("Press SPACE to simulate win",20,30);

  requestAnimationFrame(draw);
}
draw();

/* ===============================
   ★ 追加：日本語ツイート生成（Codex差替点）
================================ */
function generateJapaneseTweet({ winner, turns }) {
  if (winner === "Player") {
    return `${turns}ターンでなんとか勝利。\n撃つたびに学習するCPU、次は油断できない。\n#KGNINJA`;
  } else {
    return `${turns}ターンで敗北。\nCPUがちゃんと記憶してきた。\n#KGNINJA`;
  }
}

/* ===============================
   勝利時処理（最小修正）
================================ */
function onWin(){
  const tweetText = generateJapaneseTweet({
    winner: state.winner,
    turns: shots
  });

  const baseUrl = "https://kg-ninja.github.io/Hoge-Hogeki/";
  const intent =
    "https://twitter.com/intent/tweet?" +
    "text=" + encodeURIComponent(tweetText) +
    "&url=" + encodeURIComponent(baseUrl);

  document.getElementById("shareStatus").textContent =
    `Turns: ${shots} · Ready to tweet`;

  const btn = document.getElementById("tweetBtn");
  btn.disabled = false;
  btn.onclick = ()=>window.open(intent,"_blank");
}
</script>
</body>
</html>
